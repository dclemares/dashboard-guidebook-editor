<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Guidebook editor · new blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#161643;--blue:#385bf8;--sec:#6b6b95;--soft:#f1f3fb;--line:#e6e8f2;--bg:#f6f7fb;--side:#161643;--amber-bg:rgba(255,194,51,.22);--amber:#6b4700;--amber-ic:#7a5200;--green:#0b5c37}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--navy);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;color:inherit}button{cursor:pointer}
svg{flex:none}
[contenteditable]{outline:none}
[contenteditable]:empty::before{content:attr(data-ph);color:#b4b8d0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* barra lateral del dashboard */
.side{background:var(--side);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.logo{font-size:22px;font-weight:700;letter-spacing:-.02em;padding:2px 10px 18px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;font-size:14px;color:rgba(255,255,255,.82)}
.nav.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.side .acct{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;font-size:13px}
.side .acct i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#385bf8;font-style:normal;font-size:12px;font-weight:700}
/* cabecera */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(246,247,251,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.top .bk{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#fff;border:0}
.crumb{font-size:13px;color:var(--sec)}.crumb b{color:var(--navy);font-weight:600}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border:0;border-radius:10px;background:#fff;font-size:13.5px;font-weight:600}
.btn.pri{background:var(--blue);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:8px 24px 80px;align-items:start}
/* lienzo tipo Notion */
.paper{background:#fff;border-radius:16px;padding:36px 32px 56px 8px;min-height:80vh}
.gtitle{margin:0 0 4px 64px;font-size:30px;font-weight:700;letter-spacing:-.02em}
.gsub{margin:0 0 22px 64px;font-size:14px;color:var(--sec)}
.blk{position:relative;display:flex;align-items:flex-start;padding:3px 0;border-radius:8px}
.gut{flex:none;display:flex;gap:2px;width:56px;justify-content:flex-end;padding:4px 6px 0 0;opacity:0;transition:opacity .12s}
.blk:hover>.gut,.blk.sel>.gut{opacity:1}
.gut button{display:grid;place-items:center;width:24px;height:24px;border:0;border-radius:6px;background:none;color:#a3a8c3}
.gut button:hover{background:var(--soft);color:var(--navy)}
.bc{flex:1;min-width:0;padding:2px 8px;border-radius:8px}
.blk.sel>.bc{background:rgba(56,91,248,.045)}
.e-h1{font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:34px;padding:6px 0}
.e-h2{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:28px;padding:10px 0 2px}
.e-tx{font-size:15px;line-height:24px}
.e-sm{font-size:13px;line-height:20px;color:var(--sec)}
.e-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.e-dv{border:0;border-top:1px solid var(--line);margin:12px 0}
.e-img img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:10px}
.e-img .cap{margin-top:6px;font-size:12.5px;font-style:italic;color:var(--sec);text-align:center}
.e-vid{position:relative;display:grid;place-items:center;aspect-ratio:16/7;border-radius:10px;overflow:hidden;background:#000}
.e-vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}.e-vid span{position:relative;line-height:0}
.e-vid small{position:absolute;left:12px;top:10px;color:#fff;font-size:13px}
.e-map{height:130px;border-radius:10px;background:linear-gradient(115deg,transparent 0 44%,#fff 44% 46.5%,transparent 46.5%),linear-gradient(28deg,transparent 0 60%,#fff 60% 62%,transparent 62%),linear-gradient(90deg,#aadaff 0 16%,transparent 16%),#e8eaed;display:grid;place-items:center;color:#d93025}
.e-am{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:14px}.e-am span{display:flex;gap:8px;align-items:center}
.e-file{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:14px}.e-file b{display:block}.e-file small{color:var(--sec)}
/* bloques nuevos: igual que los verá el huésped, editables en el sitio */
.newtag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9999px;background:rgba(56,91,248,.14);color:var(--blue);font-size:10.5px;font-weight:700;letter-spacing:.03em;vertical-align:2px}
.kv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--soft)}
.kv+.kv{margin-top:8px}.kv>span:first-child{flex:1;min-width:0}
.kv small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sec)}
.kv code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:500;overflow-wrap:anywhere}
.cp{flex:none;height:32px;padding:0 14px;border:0;border-radius:9999px;background:#fff;font-size:12.5px;font-weight:600}
.cp.off{opacity:.35;text-decoration:line-through}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--amber-bg);font-size:14px;line-height:21px;color:var(--amber)}
.note .nic{color:var(--amber-ic);line-height:0;margin-top:1px;border:0;background:none;padding:0}
.note.bl{background:rgba(56,91,248,.09);color:var(--navy)}.note.bl .nic{color:var(--blue)}
.note>div{flex:1;min-width:0}
.stp{list-style:none;margin:0;padding:0;counter-reset:st}
.stp li{counter-increment:st;display:flex;gap:12px;align-items:flex-start;margin:0 0 8px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:15px;line-height:23px}
.stp li::before{content:counter(st);flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:700}
.stp li>div{flex:1;min-width:0}
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bin{position:relative;display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--soft);min-width:0}
.bin .sw{flex:none;width:14px;height:14px;margin-top:4px;border-radius:4px;border:0;padding:0}
.bin b,.pl b{display:block;font-size:14.5px;line-height:21px}.bin small,.pl small{display:block;font-size:12.5px;line-height:18px;color:var(--sec)}
.bin>div,.pl>div{flex:1;min-width:0}
.pls{display:grid;gap:8px}
.pl{position:relative;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--soft)}
.pl-ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#fff;color:var(--blue);border:0}
.cta{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;background:var(--blue);color:#fff;font-size:14.5px;font-weight:600}
.cta-dest{display:inline-flex;align-items:center;gap:6px;margin-left:10px;font-size:12.5px;color:var(--sec)}
.rm{position:absolute;right:6px;top:6px;display:none;place-items:center;width:22px;height:22px;border:0;border-radius:6px;background:#fff;color:#8a8fb3}
.sel .bin:hover .rm,.sel .pl:hover .rm,.sel .kv:hover .rm,.sel .stp li:hover .rm{display:grid}
.stp li,.kv{position:relative}
.blk:not(.sel) .addrow,.blk:not(.sel) .tg,.sel .cpv{display:none}
.cpv{display:inline-grid;place-items:center;cursor:default}
.addrow{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 10px;border:0;border-radius:8px;background:none;color:var(--blue);font-size:13px;font-weight:600}
.addrow:hover{background:var(--soft)}
/* barra de ajustes del bloque seleccionado (solo bloques nuevos) */
.bset{display:none;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 8px;padding:6px;border-radius:12px;background:#fff;box-shadow:0 6px 20px -10px rgba(22,22,67,.35),0 0 0 1px var(--line);font-size:12.5px}
.sel .bset{display:flex}
.bset .lb{padding:0 4px 0 6px;font-weight:600;color:var(--sec)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--soft)}
.seg button{height:28px;padding:0 10px;border:0;border-radius:7px;background:none;font-size:12.5px;font-weight:600;color:var(--sec)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.bset select,.bset input{height:30px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.5px}
.bset input{width:220px}
.tg{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:0;border-radius:8px;background:none;font-size:12.5px;font-weight:600}
.tg i{position:relative;width:30px;height:18px;border-radius:9999px;background:#c9cde0}.tg i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on i{background:var(--blue)}.tg.on i::after{left:14px}
/* menús emergentes */
.pop{position:absolute;z-index:50;background:#fff;border-radius:14px;box-shadow:0 18px 40px -18px rgba(22,22,67,.45),0 0 0 1px var(--line)}
.menu{width:330px;max-height:440px;overflow:auto;padding:10px}
.mg{padding:4px 0}.mg+.mg{margin-top:4px}
.mg>span{display:block;padding:6px 8px 8px;font-size:13px;color:var(--sec)}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:8px;border:0;border-radius:10px;background:none;text-align:left}
.mi:hover,.mi.hl{background:#f0f0f2}
.mi .t{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:8px;background:#fff;border:1px solid #e4e5ea;color:#8b8fa8;font-size:14px;font-weight:600;overflow:hidden}
.mi .t img{width:100%;height:100%;object-fit:cover}
.mi b{display:block;font-size:15px;font-weight:500}.mi small{display:block;font-size:13px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.mg.new>span{color:var(--blue);font-weight:600}
.icgrid{display:grid;grid-template-columns:repeat(6,36px);gap:4px;padding:8px}
.icgrid button{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:9px;background:none;color:var(--navy)}
.icgrid button:hover{background:var(--soft)}.icgrid button.on{background:rgba(56,91,248,.14);color:var(--blue)}
.swgrid{display:grid;grid-template-columns:repeat(4,28px);gap:6px;padding:10px}
.swgrid button{width:28px;height:28px;border:0;border-radius:8px}.swgrid button.on{outline:2px solid var(--navy);outline-offset:2px}
.fmt{display:flex;gap:2px;padding:4px}.fmt button{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:7px;background:none}.fmt button:hover{background:var(--soft)}
.ctx{width:200px;padding:6px}.ctx button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;font-size:13.5px;text-align:left}.ctx button:hover{background:var(--soft)}.ctx .dan{color:#c92a2a}
.addend{display:flex;align-items:center;gap:8px;margin:14px 0 0 64px;padding:8px 10px;border:0;border-radius:8px;background:none;color:#a3a8c3;font-size:14px}
.addend:hover{background:var(--soft);color:var(--navy)}
/* vista previa del huésped */
.pvw{position:sticky;top:74px}
.pvw h4{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sec)}
.ph{width:320px;border-radius:36px;padding:10px;background:#15153f}
.ph-s{height:640px;overflow:auto;border-radius:28px;background:#fff;scrollbar-width:none}.ph-s::-webkit-scrollbar{display:none}
.ph-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:12px 14px;background:rgba(255,255,255,.94);font-size:12.5px;font-weight:600;box-shadow:0 1px 0 var(--line)}
.ph-b{padding:14px;font-size:13.5px;line-height:20px}
.ph-b>*+*{margin-top:10px}
.ph-b .p-h1{font-size:19px;line-height:25px;font-weight:700;background:linear-gradient(90deg,#161643,#385bf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.ph-b .p-h2{margin-top:16px;font-size:16px;font-weight:700}
.ph-b .p-sm{font-size:12px;color:var(--sec)}
.ph-b img{display:block;width:100%;height:140px;object-fit:cover;border-radius:10px}
.ph-b .p-cap{margin-top:4px;font-size:11.5px;font-style:italic;color:var(--sec);text-align:center}
.ph-b .kv{padding:10px}.ph-b .kv code{font-size:13.5px}.ph-b .cp{height:28px;padding:0 11px;font-size:11.5px}
.ph-b .note{padding:10px;font-size:12.5px;line-height:18px}
.ph-b .stp li{padding:10px;font-size:13px;line-height:19px;margin-bottom:6px}.ph-b .stp li::before{width:22px;height:22px;font-size:11.5px}
.ph-b .bin{padding:10px}.ph-b .bin b,.ph-b .pl b{font-size:13px}.ph-b .bin small,.ph-b .pl small{font-size:11.5px;line-height:16px}
.ph-b .pl{padding:10px}.ph-b .pl-ic{width:32px;height:32px}
.ph-b .cta{height:42px;width:100%;justify-content:center;font-size:14px}
.ph-b .e-cols{gap:10px;font-size:12.5px;line-height:18px}.ph-b .e-am{font-size:12.5px}.ph-b .e-map{height:110px}.ph-b .e-file{font-size:12.5px}
.ph-cap{margin-top:10px;text-align:center;font-size:12px;color:var(--sec)}
.hint{margin:0 0 14px 64px;padding:10px 14px;border-radius:12px;background:rgba(56,91,248,.07);font-size:13px;line-height:19px;color:#2b3a8a}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:var(--navy);color:#fff;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
@media (max-width:1180px){.main{grid-template-columns:minmax(0,1fr)}.pvw{position:static;display:flex;flex-direction:column;align-items:center}}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}.paper{padding:24px 12px 40px 0}.gtitle,.gsub,.hint,.addend{margin-left:44px}.gut{width:40px}.gut .gp{display:none}.e-cols,.bins{grid-template-columns:1fr}.bset input{width:160px}.top{padding:10px 16px}.main{padding:8px 16px 60px}}
</style></head><body>
<div class="app">
<aside class="side">
  <div class="logo">Chekin</div>
  <div class="nav" data-ic="cal"></div><div class="nav" data-ic="home"></div><div class="nav" data-ic="inbox"></div><div class="nav" data-ic="up"></div><div class="nav on" data-ic="book"></div><div class="nav" data-ic="doc"></div>
  <div class="acct"><i>VC</i>Villa Calipso</div>
</aside>
<div>
  <header class="top">
    <button class="bk" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="crumb">Guidebooks / <b id="crumbName">Welcome to Villa Calipso</b></div>
    <span class="sp"></span>
    <button class="btn" id="saveBtn">Save</button><button class="btn pri" id="pubBtn">Publish</button>
  </header>
  <div class="main">
    <div class="paper" id="paper"></div>
    <aside class="pvw"><h4>Guest preview</h4><div class="ph"><div class="ph-s"><div class="ph-top">‹ <span id="pvTitle"></span></div><div class="ph-b" id="pv"></div></div></div><div class="ph-cap">Updates as you type</div></aside>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

document.addEventListener('click',function(e){
  var t=e.target;

  var cpy=t.closest('[data-copy]');if(cpy){try{navigator.clipboard.writeText(cpy.getAttribute('data-copy'));}catch(er){}cpy.textContent='Copied';setTimeout(function(){cpy.textContent='Copy';},1500);return;}
  if(t.closest('[data-cta]')){e.preventDefault();var cb=B.filter(function(b){return b.t==='cta';})[0];toast(cb&&cb.dk==='url'?'Opens '+(cb.url||'the link')+' in a new tab':'Opens the '+(cb?cb.sec:'')+' section of the guest app');return;}
  var ip=t.closest('[data-ic]');if(ip&&ip.closest('.pop')){var k=+ip.closest('.pop').getAttribute('data-k'),w=ip.closest('.pop').getAttribute('data-w'),ii=ip.closest('.pop').getAttribute('data-i');if(w==='notice')B[k].i=ip.getAttribute('data-ic');else B[k].items[+ii].i=ip.getAttribute('data-ic');closePop();renderEd();return;}
  var sp=t.closest('[data-sw]');if(sp){var pp=sp.closest('.pop');B[+pp.getAttribute('data-k')].items[+pp.getAttribute('data-i')].c=sp.getAttribute('data-sw');closePop();renderEd();return;}
  var cx=t.closest('[data-cx]');if(cx){var k4=+cx.closest('.pop').getAttribute('data-k'),a=cx.getAttribute('data-cx');if(a==='up'&&k4>0)B.splice(k4-1,0,B.splice(k4,1)[0]);if(a==='down'&&k4<B.length-1)B.splice(k4+1,0,B.splice(k4,1)[0]);if(a==='dup'){var c=JSON.parse(JSON.stringify(B[k4]));c.id=id();B.splice(k4+1,0,c);}if(a==='del'){B.splice(k4,1);SEL=null;}closePop();renderEd();return;}
  var act=t.closest('[data-a]');
  if(!t.closest('.pop'))closePop();
  if(act){var a2=act.getAttribute('data-a'),k5=blkOf(act),b=B[k5],i=+act.getAttribute('data-i');
    if(a2==='plus'){SLASH=null;openMenu(act,k5+1);return;}
    if(a2==='plusend'){SLASH=null;openMenu(act,B.length);return;}
    if(a2==='ctx'){var d=pop(act,'<div class="ctx"><button data-cx="up">'+ic('up',15)+'Move up</button><button data-cx="down">'+ic('down',15)+'Move down</button><button data-cx="dup">'+ic('dup',15)+'Duplicate</button><button data-cx="del" class="dan">'+ic('trash',15)+'Delete</button></div>');d.setAttribute('data-k',k5);return;}
    if(a2==='nstyle'){b.s=act.getAttribute('data-k');if(b.i==='warn'||b.i==='info')b.i=b.s==='warn'?'warn':'info';renderEd();return;}
    if(a2==='icpick'){var cur=act.getAttribute('data-k')==='notice'?b.i:b.items[i].i;var d2=pop(act,'<div class="icgrid">'+ICONSET.map(function(n){return '<button data-ic="'+n+'" class="'+(n===cur?'on':'')+'" title="'+n+'">'+ic(n,18)+'</button>';}).join('')+'</div>');d2.setAttribute('data-k',k5);d2.setAttribute('data-w',act.getAttribute('data-k'));d2.setAttribute('data-i',i);return;}
    if(a2==='swpick'){var d3=pop(act,'<div class="swgrid">'+COLOURS.map(function(c){return '<button data-sw="'+c[0]+'" title="'+c[1]+'" style="background:'+c[0]+'" class="'+(c[0]===b.items[i].c?'on':'')+'"></button>';}).join('')+'</div>');d3.setAttribute('data-k',k5);d3.setAttribute('data-i',i);return;}
    if(a2==='copytg'){b.rows[i].c=!b.rows[i].c;renderEd();return;}
    if(a2==='addrow'){if(b.rows.length<6)b.rows.push({l:'',v:'',c:true});else toast('Up to 6 rows per info box');renderEd();focusP(k5+'.rows.'+(b.rows.length-1)+'.l');return;}
    if(a2==='rmrow'){b.rows.splice(i,1);renderEd();return;}
    if(a2==='addstep'){if(b.items.length<15)b.items.push('');renderEd();focusP(k5+'.items.'+(b.items.length-1));return;}
    if(a2==='rmstep'){b.items.splice(i,1);renderEd();return;}
    if(a2==='additem'){if(b.t==='colours'){if(b.items.length<12)b.items.push({c:COLOURS[b.items.length%8][0],ti:'',d:''});}else if(b.items.length<10)b.items.push({i:'pin',ti:'',d:''});renderEd();focusP(k5+'.items.'+(b.items.length-1)+'.ti');return;}
